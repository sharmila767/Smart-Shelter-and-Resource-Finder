<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescueAI | AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="shelters.html">Find Shelter</a>
    <a href="evacuation.html">Evacuation</a>
    <a href="resources.html">Resources</a>
    <a href="assistant.html">AI Assistant</a>
</nav>

<main>

<section class="page-header">
    <h1>🤖 RescueAI</h1>
    <p>Intelligent Disaster Response Assistant</p>
</section>

<section class="hero">

    <h2>How can RescueAI help you?</h2>

    <textarea id="message"
        rows="5"
        placeholder="Example: There is a flood near my home. What should I do?"></textarea>

    <br><br>

    <button class="btn" onclick="askRescueAI()">
        Ask RescueAI
    </button>

    <div id="response" style="margin-top:25px; padding:20px;"></div>

</section>

</main>

<footer>
    <p>RescueAI | Hackathon Prototype</p>
</footer>


<script>

function askRescueAI() {

    const input = document.getElementById("message").value.toLowerCase();
    const response = document.getElementById("response");

    if (!input.trim()) {
        response.innerText = "Please describe your emergency situation.";
        return;
    }

    if (input.includes("flood")) {

        response.innerText =
        "🌊 RESCUEAI: Move to higher ground immediately. " +
        "Do not walk or drive through floodwater. " +
        "Stay away from electrical wires and follow official evacuation instructions.";

    }

    else if (input.includes("earthquake")) {

        response.innerText =
        "🌍 RESCUEAI: Drop, cover, and hold on during shaking. " +
        "Stay away from windows and heavy objects. " +
        "When the shaking stops, move to a safe open area if possible.";

    }

    else if (input.includes("fire")) {

        response.innerText =
        "🔥 RESCUEAI: Leave the building using the safest exit. " +
        "Do not use elevators. Stay away from smoke and contact emergency services if you are in danger.";

    }

    else if (input.includes("cyclone")) {

        response.innerText =
        "🌪️ RESCUEAI: Stay indoors and away from windows. " +
        "Follow official evacuation instructions and keep emergency supplies, water, and communication devices ready.";

    }

    else if (input.includes("landslide")) {

        response.innerText =
        "⛰️ RESCUEAI: Move away from the landslide area and unstable slopes. " +
        "Do not approach debris. Follow evacuation instructions from local authorities.";

    }

    else {

        response.innerText =
        "🤖 RESCUEAI: Please tell me what disaster you are facing, such as a flood, earthquake, fire, cyclone, or landslide. I will provide basic safety guidance.";

    }

}

</script>

</body>
</html>
