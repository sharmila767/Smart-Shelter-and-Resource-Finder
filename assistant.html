<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Assistant | RescueAI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="shelters.html">Find Shelter</a>
        <a href="evacuation.html">Evacuation</a>
        <a href="resources.html">Resources</a>
        <a href="assistant.html">AI Assistant</a>
    </nav>

    <main>

        <section class="page-header">

            <h1>🤖 RescueAI</h1>

            <p>
                Intelligent Disaster Response Assistant
            </p>

        </section>

        <section class="hero">

            <h2>How can RescueAI help you?</h2>

            <p>
                Describe your emergency situation below.
            </p>

            <textarea id="message"
                placeholder="Example: There is a flood near my home. What should I do?"
                rows="5"></textarea>

            <br><br>

            <button class="btn" onclick="askRescueAI()">
                Ask RescueAI
            </button>

            <div id="response"
                style="margin-top: 25px; padding: 20px;">
            </div>

        </section>

    </main>

    <footer>

        <p>
            RescueAI | Hackathon Prototype
        </p>

    </footer>


    <script>

        async function askRescueAI() {

            const message = document.getElementById("message").value;
            const responseBox = document.getElementById("response");

            if (!message.trim()) {
                responseBox.innerText = "Please describe your situation.";
                return;
            }

            responseBox.innerText = "🤖 RescueAI is thinking...";

            try {

                const response = await fetch("http://127.0.0.1:5000/ask", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                });

                const data = await response.json();

                responseBox.innerText = data.reply || data.error;

            } catch (error) {

                responseBox.innerText =
                    "Unable to connect to RescueAI backend. Please make sure the Flask server is running.";

            }

        }

    </script>

</body>

</html>
